name: Build APK Master
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Auto-Fix & Build APK
        run: |
          set -e
          echo "=== 1. Searching for Project Root ==="
          PROJ_DIR=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1 | xargs dirname)
          if [ -z "$PROJ_DIR" ]; then PROJ_DIR="."; fi
          echo "Found Project in: $PROJ_DIR"
          cd "$PROJ_DIR"

          echo "=== 2. Ensuring Version Catalog Exists ==="
          mkdir -p gradle
          if [ ! -f gradle/libs.versions.toml ]; then
            cat << 'EOF' > gradle/libs.versions.toml
          [versions]
          agp = "8.7.2"
          kotlin = "2.0.21"
          ksp = "2.0.21-1.0.28"
          roborazzi = "1.34.0"
          secrets = "2.0.1"
          googleServices = "4.4.2"
          composeBom = "2024.10.01"

          [libraries]
          androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }

          [plugins]
          android-application = { id = "com.android.application", version.ref = "agp" }
          kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
          google-devtools-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
          roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
          secrets = { id = "com.google.android.libraries.mapsplatform.secrets-gradle-plugin", version.ref = "secrets" }
          google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
          EOF
          fi

          echo "=== 3. Running Build with Fallback ==="
          # Pehle standard assembleDebug try karein, agar na mile to general assemble chalayein
          gradle assembleDebug --no-daemon || gradle assemble --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EduStudio-APK
          path: "**/*.apk"
          if-no-files-found: error
