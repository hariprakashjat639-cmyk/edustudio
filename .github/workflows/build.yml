name: Build APK Master Fix
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Fix Project Structure and Build
        run: |
          set -e
          echo "=== 1. Checking Repository Content ==="
          ls -la

          # Agar app folder kisi sub-directory ke andar hai to use root me layein
          if [ ! -d "app" ]; then
            SUB_APP=$(find . -maxdepth 3 -type d -name "app" | head -n 1)
            if [ -n "$SUB_APP" ]; then
              echo "Moving $SUB_APP to ./app"
              cp -r "$SUB_APP" ./app
            fi
          fi

          echo "=== 2. Setting up settings.gradle.kts ==="
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "EduCreator Studio"
          include(":app")
          EOF

          echo "=== 3. Ensuring Version Catalog Exists ==="
          mkdir -p gradle
          cat << 'EOF' > gradle/libs.versions.toml
          [versions]
          agp = "8.7.2"
          kotlin = "2.0.21"
          ksp = "2.0.21-1.0.28"
          roborazzi = "1.34.0"
          secrets = "2.0.1"
          googleServices = "4.4.2"
          composeBom = "2024.10.01"

          [libraries]
          androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }

          [plugins]
          android-application = { id = "com.android.application", version.ref = "agp" }
          kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
          google-devtools-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
          roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
          secrets = { id = "com.google.android.libraries.mapsplatform.secrets-gradle-plugin", version.ref = "secrets" }
          google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
          EOF

          echo "=== 4. Building APK ==="
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EduStudio-Final-APK
          path: "**/build/outputs/apk/debug/*.apk"
